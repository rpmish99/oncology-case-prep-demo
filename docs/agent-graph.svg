<rect x="430" y="204" width="230" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="545.0" y="228.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">Evidence</text><text x="545.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">gpt-6.1-terra, File Search and PubMed</text>
<rect x="200" y="300" width="170" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="285.0" y="324.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">Verifier</text><text x="285.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">gpt-6.1-sol, checks the draft</text>
<rect x="430" y="300" width="230" height="64" rx="8" fill="#FAEEDA" stroke="#B45309" stroke-width="1"/><text x="545.0" y="324.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#633806">Clinician approves</text><text x="545.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">the run pauses until a decision</text>
