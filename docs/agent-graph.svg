<rect x="200" y="130" width="170" height="104" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="285.0" y="174.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">Manager</text><text x="285.0" y="194.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">gpt-6.1-sol</text>
<text x="545" y="22" text-anchor="middle" font-size="12" fill="#5F5E5A">Started together</text>
