<rect x="430" y="226" width="230" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="545.0" y="246.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">Similar cases</text><text x="545.0" y="266.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">gpt-6.1-terra, searches past cases</text>
<rect x="200" y="310" width="170" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="285.0" y="334.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">Verifier</text><text x="285.0" y="354.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">gpt-6.1-sol, checks the draft</text>
<rect x="430" y="310" width="230" height="56" rx="8" fill="#FAEEDA" stroke="#B45309" stroke-width="1"/><text x="545.0" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#633806">Clinician approves</text><text x="545.0" y="350.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">the run pauses until a decision</text>
