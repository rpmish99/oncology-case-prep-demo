<rect x="200" y="120" width="170" height="124" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="285.0" y="174.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">Case coordinator</text><text x="285.0" y="194.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">gpt-6.1-sol</text>
<text x="545" y="18" text-anchor="middle" font-size="12" fill="#5F5E5A">Started together</text>
<rect x="430" y="28" width="230" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="545.0" y="48.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">Patient data</text><text x="545.0" y="68.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">gpt-6.1-terra, reads record by MCP</text>
<rect x="430" y="94" width="230" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="545.0" y="114.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">Clinical history</text><text x="545.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">gpt-6.1-terra, reads record by MCP</text>
